# CafeStock - INF2006 Team Project 1. Schema from the brief (section 8); extra fields are marked.
# Every path is relative to the ZIP root. `npm run submission` checks that each one exists.
project:
  group_id: 'G004' # TO FILL, e.g. "G012"
  title: 'CafeStock - stock inventory and reorder forecasting for small cafes'
  problem_statement: >-
    Small cafes run out of fast-moving ingredients or waste perishable stock because stock is
    tracked on paper and reordered by feel. CafeStock lets staff record deliveries, usage, waste
    and counts, and gives the manager a nightly, explained reorder recommendation per ingredient
    based on a demand forecast. Managers also plan the weekly staff roster (shifts, positions,
    hours per person, no double-booking); staff see only their own shifts.
  cloud_provider: 'AWS'
  repository_commit: '' # optional
