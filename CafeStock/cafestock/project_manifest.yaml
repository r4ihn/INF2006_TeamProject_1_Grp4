data_ai:
  dataset: 'data/README.md'
  data_dictionary: 'data/DATA_DICTIONARY.md' # extra field
  method: >-
    Daily ingredient demand is forecast 7 days ahead. Candidate A is a global LightGBM regression
    model (lgbm-v1: 10 calendar and recent-demand features, targets scaled per item, trained on a
    frozen snapshot, deterministic). Candidate B is a 14-day moving average. Reorder
    recommendations use the chosen forecast: lead-time demand + safety stock
    (1.65 x sigma x sqrt(lead time)) = reorder point; order up to the reorder point plus 7 days'
    demand, capped by shelf life. Each nightly run scores both candidates on the last 8 weeks and
    keeps the lower MASE.
  evaluation: >-
    Walk-forward over 47 weeks x 8 items, model retrained before each week using only earlier
    data. Headline MASE (vs "same day last week"): 14-day average 0.827, LightGBM 0.855; weekly
    WAPE 23.4% vs 21.4%. Results, charts and limitations in analytics/README.md and
    evidence/test-data-ai.md.
  reproducible_command: 'cd src && npm run forecast:setup && npm run analytics:setup && npm run analytics && npm run analytics:test'
  notebook: 'analytics/demand_model.ipynb' # extra field
security:
  threat_control_map: 'evidence/threat-control-map.md'
  secrets_handling: >-
    The database password is generated by AWS Secrets Manager (cafestock/database) and never
    typed, committed or logged. App servers read it at start-up into a root-only file; the Lambda
    reads it through a VPC endpoint. No AWS access keys are used anywhere (Learner Lab roles).
    Only .env.example files with placeholders are included.
run:
  prerequisites:
    - 'Node.js 24 LTS (or 22.12+)'
    - 'Docker Desktop (local PostgreSQL 17)'
    - 'Python 3.12+ (forecasting and analytics)'
    - 'Optional for deployment: AWS Academy Learner Lab account (us-east-1)'
  commands:
    - 'cd src'
    - 'npm install'
    - 'npm run db:setup'
    - 'npm run db:import'
    - 'npm run dev'
    - 'npm test'
    - 'npm run forecast:setup && npm run forecast:test'
    - 'npm run analytics:setup && npm run analytics:test'
declarations:
  ai_use: 'AI_USE_DECLARATION.md'
  contributions: 'TEAM_CONTRIBUTIONS.md'
