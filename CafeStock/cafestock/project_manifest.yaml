architecture:
  diagram: 'evidence/architecture.png'
  service_model: >-
    IaaS for the web/API tier (EC2 Auto Scaling group behind an Application Load Balancer, which
    we patch and configure ourselves); PaaS for data and background work (Amazon RDS for
    PostgreSQL, AWS Lambda, API Gateway HTTP API, S3, Secrets Manager, CloudWatch); managed
    identity service (Amazon Cognito). Alternatives considered: Elastic Beanstalk/App Runner
    (less control, not all available in the Learner Lab), containers on ECS Fargate (higher cost,
    more set-up), DynamoDB (poor fit for relational stock and forecast data).
  deployment_model: >-
    Public cloud, single region (us-east-1) across two Availability Zones, in one AWS Academy
    Learner Lab account; all infrastructure as code with AWS CloudFormation (src/infra/).
  components:
    - 'API Gateway HTTP API cafestock-web (HTTPS entry, throttling, VPC link cafestock-vpc-link)'
    - 'Application Load Balancer cafestock-alb (internal) with AWS WAF web ACL cafestock-web'
    - 'EC2 Auto Scaling group cafestock-app (Node.js 24 API + React web app, deploy/ec2/bootstrap.sh)'
    - 'Amazon RDS for PostgreSQL 17 cafestock-db (private subnets, TLS, encrypted)'
    - 'AWS Lambda cafestock-forecast (Python 3.13, LightGBM) + EventBridge rule cafestock-forecast-nightly'
    - 'Amazon S3 cafestock-artifacts-<account>-<region> (release, Lambda package, models)'
    - 'AWS Secrets Manager cafestock/database'
    - 'Amazon Cognito user pool cafestock-users (groups manager, staff)'
    - 'VPC cafestock-vpc with S3 and Secrets Manager endpoints (stack cafestock-network)'
    - 'CloudWatch logs, metrics, dashboards cafestock-app and cafestock-forecast, alarms; SNS cafestock-forecast-alerts'
  templates: # extra field
    - 'src/infra/cognito.yaml'
    - 'src/infra/artifacts.yaml'
    - 'src/infra/network.yaml'
    - 'src/infra/database.yaml'
    - 'src/infra/app.yaml'
    - 'src/infra/forecast.yaml'
